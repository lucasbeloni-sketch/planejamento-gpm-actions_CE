name: Pipeline Planejamento CE (GPM -> Plan_Principal -> COMPILADO)

on:
  schedule:
    - cron: "0 */2 * * *"   # de 2 em 2 horas, no minuto 0. Os robos CE dividem a mesma
                            # conta do GPM, entao cada um tem seu minuto: 0 aqui,
                            # 20 no exportacao-obras, 40 no checklists-formulario.
  workflow_dispatch:         # botao manual na aba Actions
    inputs:
      somente_plan:
        description: "Pular baixar+compilador e rodar so as Etapas 3 e 4 (Plan_Principal + COMPILADO)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write              # pra abrir/comentar issue de falha

# Evita 2 runs simultaneos (cron + manual) escrevendo os mesmos arquivos no Drive/Sheets.
concurrency:
  group: planejamento-gpm-CE
  cancel-in-progress: false

jobs:
  # Etapa 1: baixa o relatorio Consulta Servicos do GPM CE e sobe o CSV no Drive.
  baixar:
    if: ${{ !inputs.somente_plan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm install

      - name: Testes unitarios
        run: npm test

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Baixar relatorio e enviar ao Drive
        run: npm start
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GPM_USER: ${{ secrets.GPM_USER }}
          GPM_PASS: ${{ secrets.GPM_PASS }}

      - name: Upload artefatos de debug (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

  # Etapa 2: roda so depois do baixar terminar OK. Le os CSVs da pasta do Drive,
  # gera o BANCO.csv e atualiza a aba BD_ConsultaServ.
  compilador:
    needs: baixar
    if: ${{ !inputs.somente_plan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r compilador/requirements.txt

      - name: Run compilador
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python compilador/compilador_consulta_servicos_GPM_CE.py

  # Etapa 3: reaplica/congela as formulas da Plan_Principal de cada unidade + chuva.
  plan_principal:
    needs: compilador
    # Roda no fluxo normal (compilador OK) e tambem quando somente_plan pula o
    # compilador (result 'skipped'). So nao roda se o compilador falhar/cancelar.
    if: ${{ always() && needs.compilador.result != 'failure' && needs.compilador.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_principal/requirements.txt

      # Climatologia da chuva (12 anos de Open-Meteo por local) guardada entre runs:
      # sem isso a Etapa 3 rebaixava tudo a cada run (10-30 min + limite da API).
      # Chave por ano; dentro do ano, uma chave nova so quando entra local novo.
      - name: Ano do cache da chuva
        id: ano
        run: echo "ano=$(date +%Y)" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache da climatologia
        uses: actions/cache/restore@v6
        with:
          path: .cache/chuva
          key: chuva-climo-${{ steps.ano.outputs.ano }}-
          restore-keys: chuva-climo-${{ steps.ano.outputs.ano }}-

      - name: Run Etapa 3 - atualizar Plan_Principal (CE)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CHUVA_CACHE_DIR: .cache/chuva
        run: python plan_principal/atualizar_plan_principal_CE.py

      # always(): o que foi baixado antes de uma falha tambem vale (gravacao atomica).
      - name: Salvar cache da climatologia
        if: ${{ always() && hashFiles('.cache/chuva/**') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .cache/chuva
          key: chuva-climo-${{ steps.ano.outputs.ano }}-${{ hashFiles('.cache/chuva/**') }}

  # Etapa 4: consolida CSVs + Plan_Principal!B5:CH das unidades no COMPILADO.csv.
  compilar_planilha:
    needs: plan_principal
    # always() para nao herdar o skip de baixar/compilador na cadeia; roda sempre
    # que a Etapa 3 tiver passado.
    if: ${{ always() && needs.plan_principal.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_principal/requirements.txt

      - name: Run Etapa 4 - compilar planilha principal (CE)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python plan_principal/compilador_planilha_principal_CE.py

  notify:
    needs: [baixar, compilador, plan_principal, compilar_planilha]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          # `needs` nao existe como global no github-script; entra por env.
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const label = "pipeline-CE-falha";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            const needs = JSON.parse(process.env.NEEDS_JSON || "{}");
            const failed = ["baixar", "compilador", "plan_principal", "compilar_planilha"]
              .filter((j) => needs[j] && needs[j].result === "failure")
              .join(", ") || "desconhecida";
            const body = `Pipeline Planejamento CE falhou no run ${context.runId}.\n\nEtapa(s) com falha: **${failed}**\n\nLog: ${url}\n\nO CSV do mes, a \`BD_ConsultaServ\`, as \`Plan_Principal\` ou o \`COMPILADO.csv\` podem estar desatualizados ate o proximo run dar certo. Se a falha foi no \`baixar\`, baixe os artefatos de debug do run pra ver os screenshots.`;
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "Pipeline Planejamento CE falhando", body, labels: [label] });
            }
