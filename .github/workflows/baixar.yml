name: Consulta Servico GPM (baixar + compilar)

on:
  schedule:
    - cron: "0 */2 * * *"   # de 2 em 2 horas (minuto 0). Ajuste se quiser.
  workflow_dispatch:         # botao manual na aba Actions
    inputs:
      somente_plan:
        description: "Pular baixar+compilador e rodar so as Etapas 2 e 3 (Plan_Principal + COMPILADO)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write              # pra abrir/comentar issue de falha

# Evita 2 runs simultaneos (cron + manual) escrevendo o mesmo arquivo no Drive.
concurrency:
  group: consulta-servico-gpm
  cancel-in-progress: false

jobs:
  baixar:
    if: ${{ !inputs.somente_plan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm install

      - name: Testes unitarios
        run: npm test

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Baixar relatorio e enviar ao Drive
        run: npm start
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GPM_USER: ${{ secrets.GPM_USER }}
          GPM_PASS: ${{ secrets.GPM_PASS }}

      - name: Upload artefatos de debug (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

  # Roda so depois do baixar terminar OK. Le o CSV que o baixar subiu no Drive e compila pro Sheet.
  compilador:
    needs: baixar
    if: ${{ !inputs.somente_plan }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r compilador/requirements.txt

      - name: Run compilador
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python compilador/compilador_consulta_servicos_GPM_CE.py

  # Etapa 2: reaplica/congela as formulas da Plan_Principal de cada unidade + chuva.
  plan_principal:
    needs: compilador
    # Roda no fluxo normal (compilador OK) e tambem quando somente_plan pula o
    # compilador (result 'skipped'). So nao roda se o compilador falhar/cancelar.
    if: ${{ always() && needs.compilador.result != 'failure' && needs.compilador.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_principal/requirements.txt

      - name: Run Etapa 2 - atualizar Plan_Principal (CE)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python plan_principal/atualizar_plan_principal_CE.py

  # Etapa 3: consolida CSVs + Plan_Principal!B5:CH das unidades no COMPILADO.csv.
  compilar_planilha:
    needs: plan_principal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plan_principal/requirements.txt

      - name: Run Etapa 3 - compilar planilha principal (CE)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python plan_principal/compilador_planilha_principal_CE.py

  notify:
    needs: [baixar, compilador, plan_principal, compilar_planilha]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const label = "consulta-servico-falha";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label });
            const body = `Pipeline Consulta Servicos (baixar + compilar) falhou no run ${context.runId}.\n\nLog: ${url}\n\nO CSV do mes ou a planilha podem estar desatualizados ate o proximo run dar certo. Baixe os artefatos de debug do run pra ver os screenshots.`;
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "Consulta Servico GPM falhando", body, labels: [label] });
            }
